name: Apply V8.9.1 integration overlay

on:
  push:
    branches: [v18-rc-auto]
    paths: [forklift_v8_9_1_integration_hotfix.zip]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18-rc-auto
          fetch-depth: 0
      - name: Overlay V8.9.1 files
        run: |
          rm -rf "$RUNNER_TEMP/v891"
          mkdir -p "$RUNNER_TEMP/v891"
          unzip -q forklift_v8_9_1_integration_hotfix.zip -d "$RUNNER_TEMP/v891"
          rsync -a --exclude '.github/workflows/build-apk.yml' "$RUNNER_TEMP/v891/" ./
          rm -f forklift_v8_9_1_integration_hotfix.zip
          rm -f .github/workflows/apply-v891-hotfix.yml
      - name: Commit overlay source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply V8.9.1 integration hotfix overlay"
          git push origin HEAD:v18-rc-auto
