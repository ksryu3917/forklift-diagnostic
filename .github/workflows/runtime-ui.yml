name: V8.9.4 Manual Library Final Runtime Gate

on:
  workflow_dispatch:

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate committed source
        run: |
          python3 tools/validate_v893_project_integrity.py .
          python3 tools/validate_manual_library_catalog.py .
          python3 tools/validate_v893_quick_ui.py .
          python3 tools/validate_adaptive_branch_v89.py .
          python3 tools/validate_test_point_locator.py .

      - name: Stamp exact source identity
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("app/src/main/assets/diagnostic_release.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["git_commit_sha"]=os.environ["BUILD_SHA"]
          d["source_branch"]=os.environ["BUILD_BRANCH"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device unavailable; continue without blind retry."
          fi

      - name: Run exact V8.9.3 runtime tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            bash -lc 'set -e; mkdir -p build/runtime-ui; for t in licenseLocalBranchShowsExactlyOnePointAtATime licenseCommonFailureMovesOnlyToLampPath circuitViewerPinchAndDragChangesRenderedImage; do set +e; gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ryu.forkliftdiagnostic.QuickUiRuntimeTest#$t; TEST_STATUS=$?; set -e; adb pull /sdcard/Download/v893-runtime/. build/runtime-ui/ || true; if [ "$TEST_STATUS" -ne 0 ]; then echo "Instrumentation failed; evidence was pulled before exit."; exit "$TEST_STATUS"; fi; done; for f in 01-license-initial-LP1.png 02-license-LP2-power.png 03-license-LP3-ground-drop.png 04-license-bulb-socket-stop.png 05-license-common-LAMP.png 06-zoom-before.png 07-zoom-after-pinch.png 08-zoom-after-drag.png; do test -s "build/runtime-ui/$f"; done'

      - name: Verify final APK identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as z:
              d=json.loads(z.read("assets/diagnostic_release.json"))
          assert d["release"]=="v18"
          assert d["state"]=="RC EXPERT V8.9.4 MANUAL LIBRARY"
          assert d["version_name"]=="0.18-rc-expert-v8.9.4-manual-library"
          assert d["source_branch"]=="v18-rc-auto"
          assert d["git_commit_sha"]==os.environ["BUILD_SHA"]
          print("FINAL_RUNTIME_VERIFIED",d)
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v893-runtime-evidence-${{ github.sha }}
          path: |
            build/runtime-ui/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          retention-days: 30

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v894-manual-library-VERIFIED-${{ github.sha }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
