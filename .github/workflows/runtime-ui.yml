name: V8.9.3 Final Runtime Gate

on:
  workflow_dispatch:

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 13dd2d10392465e6ef167651ef4a96920d589474
      TARGET_BRANCH: v18-rc-auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify immutable candidate checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate committed source
        run: |
          python3 tools/validate_v893_project_integrity.py .
          python3 tools/validate_v893_quick_ui.py .
          python3 tools/validate_adaptive_branch_v89.py .
          python3 tools/validate_test_point_locator.py .

      - name: Stamp exact source identity
        env:
          BUILD_SHA: ${{ env.TARGET_SHA }}
          BUILD_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("app/src/main/assets/diagnostic_release.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["git_commit_sha"]=os.environ["BUILD_SHA"]
          d["source_branch"]=os.environ["BUILD_BRANCH"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM when available
        run: |
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm
          ls -l /dev/kvm || echo "KVM device unavailable; continue without blind retry."

      - name: Run exact V8.9.3 runtime tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            mkdir -p build/runtime-ui
            mkdir -p build/runtime-ui/results
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ryu.forkliftdiagnostic.QuickUiRuntimeTest#licenseLocalBranchShowsExactlyOnePointAtATime
            adb pull /sdcard/Download/v893-runtime/. build/runtime-ui/
            cp app/build/outputs/androidTest-results/connected/debug/TEST-*.xml build/runtime-ui/results/01-license-local.xml
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ryu.forkliftdiagnostic.QuickUiRuntimeTest#licenseCommonFailureMovesOnlyToLampPath
            adb pull /sdcard/Download/v893-runtime/. build/runtime-ui/
            cp app/build/outputs/androidTest-results/connected/debug/TEST-*.xml build/runtime-ui/results/02-license-common.xml
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ryu.forkliftdiagnostic.QuickUiRuntimeTest#circuitViewerPinchAndDragChangesRenderedImage
            adb pull /sdcard/Download/v893-runtime/. build/runtime-ui/
            cp app/build/outputs/androidTest-results/connected/debug/TEST-*.xml build/runtime-ui/results/03-zoom.xml
            test -s build/runtime-ui/01-license-initial-LP1.png
            test -s build/runtime-ui/02-license-LP2-power.png
            test -s build/runtime-ui/03-license-LP3-ground-drop.png
            test -s build/runtime-ui/04-license-bulb-socket-stop.png
            test -s build/runtime-ui/05-license-common-LAMP.png
            test -s build/runtime-ui/06-zoom-before.png
            test -s build/runtime-ui/07-zoom-after-pinch.png
            test -s build/runtime-ui/08-zoom-after-drag.png
            grep -q 'tests="1" failures="0" errors="0" skipped="0"' build/runtime-ui/results/01-license-local.xml
            grep -q 'tests="1" failures="0" errors="0" skipped="0"' build/runtime-ui/results/02-license-common.xml
            grep -q 'tests="1" failures="0" errors="0" skipped="0"' build/runtime-ui/results/03-zoom.xml

      - name: Verify final APK identity
        env:
          BUILD_SHA: ${{ env.TARGET_SHA }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as z:
              d=json.loads(z.read("assets/diagnostic_release.json"))
          assert d["release"]=="v18"
          assert d["state"]=="RC EXPERT V8.9.3 FIELD REBUILD"
          assert d["version_name"]=="0.18-rc-expert-v8.9.3-field-rebuild"
          assert d["source_branch"]=="v18-rc-auto"
          assert d["git_commit_sha"]==os.environ["BUILD_SHA"]
          print("FINAL_RUNTIME_VERIFIED",d)
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v893-runtime-evidence-${{ env.TARGET_SHA }}
          path: |
            build/runtime-ui/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          retention-days: 30

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v893-VERIFIED-${{ env.TARGET_SHA }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
