name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "v18-rc-auto" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate diagnostic graphs
        run: python3 tools/validate_transmission_graph.py

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v18-rc-auto-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload diagnostic validation report
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v18-validation
          path: build/reports/transmission_graph_validation.*
          retention-days: 30
