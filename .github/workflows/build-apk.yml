name: Build Android APK Candidate

on:
  workflow_dispatch:
  push:
    branches: [ "v18-rc-auto" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate committed source integration
        run: |
          python3 tools/validate_v893_project_integrity.py .
          python3 tools/validate_manual_library_catalog.py .

      - name: Run diagnostic validators
        run: |
          python3 tools/validate_field_diagnostics.py
          python3 tools/validate_electrical_diagnostics.py
          python3 tools/validate_expert_v2.py
          python3 tools/validate_engine_d24_v2.py
          python3 tools/validate_field_readiness_v3.py
          python3 tools/validate_parts_reference.py
          python3 tools/validate_diagnostic_first_priority.py
          python3 tools/validate_field_location_map.py .
          python3 tools/validate_engine_sensor_locator.py .
          python3 tools/validate_test_point_locator.py .
          python3 tools/validate_measurement_worksheet.py .
          python3 tools/validate_oem_auto_evaluation.py .
          python3 tools/validate_adaptive_branch_v89.py .
          python3 tools/validate_v893_quick_ui.py .
          python3 tools/validate_diagnostic_specificity.py .

      - name: Stamp exact source identity
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("app/src/main/assets/diagnostic_release.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["git_commit_sha"]=os.environ["BUILD_SHA"]
          d["source_branch"]=os.environ["BUILD_BRANCH"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Build candidate APK
        run: gradle :app:assembleDebug

      - name: Verify candidate identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as z:
              d=json.loads(z.read("assets/diagnostic_release.json"))
          assert d["release"]=="v18"
          assert d["state"]=="RC EXPERT V8.9.4 MANUAL LIBRARY"
          assert d["version_name"]=="0.18-rc-expert-v8.9.4-manual-library"
          assert d["source_branch"]=="v18-rc-auto"
          assert d["git_commit_sha"]==os.environ["BUILD_SHA"]
          print(d)
          PY

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: forklift-diagnostic-v894-manual-library-candidate-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
