name: V20 Candidate Build
on:
  push:
    branches: [ "v20-clean-rebuild" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Migrate historical data without modifying source records
        run: |
          python3 tools/migrate_v20.py
          python3 tools/validate_migration_parity.py
          python3 tools/migrate_evidence_v20.py
      - name: Test engine guards and executed measurement paths
        run: |
          mkdir -p build/engine-test
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o build/json.jar
          javac -cp build/json.jar -d build/engine-test app/src/main/java/com/ryu/forkliftdiagnostic/engine/DiagnosticEngine.java tools/EngineContractTest.java tools/MeasurementContractTest.java tools/LampFlowTest.java
          java -cp build/json.jar:build/engine-test EngineContractTest | tee build/engine-contract.txt
          java -cp build/json.jar:build/engine-test MeasurementContractTest | tee build/measurement-contract.txt
          java -cp build/json.jar:build/engine-test LampFlowTest | tee build/lamp-flow.txt
      - name: Stamp build identity
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: python3 tools/stamp_v20_identity.py .
      - name: Build
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forklift-v20-UNVERIFIED-development-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            validation/**
            build/engine-contract.txt
            build/measurement-contract.txt
            build/lamp-flow.txt
      - name: Full release readiness remains required
        run: python3 tools/validate_release_readiness.py
