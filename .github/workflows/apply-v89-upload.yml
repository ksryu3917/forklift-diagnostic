name: Apply uploaded V8.9 patch

on:
  push:
    branches: [v18-rc-auto]
    paths:
      - 'v89.zip.part.*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18-rc-auto
          fetch-depth: 0
      - name: Reassemble and expand patch
        run: |
          cat v89.zip.part.* > "$RUNNER_TEMP/v89.zip"
          echo "361246b53ff95dd3283fb55da05d2e1c56cba84208e9151cd81156e96318591a  $RUNNER_TEMP/v89.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v89"
          unzip -q "$RUNNER_TEMP/v89.zip" -d "$RUNNER_TEMP/v89"
          rsync -a "$RUNNER_TEMP/v89/expert_v89/" ./
          rm -f forklift_field_expert_v8_9_adaptive_branch.zip
          rm -f v89.zip.part.*
          rm -f .github/workflows/apply-v89-upload.yml
      - name: Commit applied source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply RC EXPERT V8.9 adaptive branch"
          git push origin HEAD:v18-rc-auto
