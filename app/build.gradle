plugins {
    id 'com.android.application'
}
def projectState = new groovy.json.JsonSlurper().parse(rootProject.file('PROJECT_STATE.json'))
android {
    namespace 'com.ryu.forkliftdiagnostic'
    compileSdk 35
    defaultConfig {
        applicationId projectState.application_id
        minSdk 26
        targetSdk 35
        versionCode projectState.version_code as Integer
        versionName projectState.version_name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    sourceSets {
        main {
            java {
                include 'com/ryu/forkliftdiagnostic/MainActivity.java'
                include 'com/ryu/forkliftdiagnostic/core/**'
                include 'com/ryu/forkliftdiagnostic/engine/**'
                include 'com/ryu/forkliftdiagnostic/ui/**'
            }
            assets { include 'v20/**'; exclude 'v20/legacy/**' }
        }
        androidTest { java { include 'com/ryu/forkliftdiagnostic/V20RuntimeGateTest.java' } }
    }
}
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
